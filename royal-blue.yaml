# Hermes skin — Cyberpunk (Azul royal)
# Neon-azul royal cyberpunk terminal over near-black: the same palette family as the
# desktop/dashboard "cyberpunk" theme (neon green #00ff41 on #000a00), re-hued to
# azul royal.
#
# Activate:  hermes config set display.skin royal-blue
# One color: hermes skin set ui_tool "#8aa6ff"
# Revert:    hermes config set display.skin default

name: royal-blue
description: Cyberpunk azul royal — neon azul sobre preto

colors:
  # ── Canvas ────────────────────────────────────────────────────────────────
  # `background` is deliberately NOT authored: a skin that sets it makes the TUI
  # paint the terminal (OSC-11) opaque, which kills terminal transparency. Without
  # it every surface renders on the user's own (possibly translucent) terminal and
  # the polarity comes from host detection — exactly what the built-in `default`
  # skin does. The desktop GUI still gets a dark canvas from status_bar_bg.

  # ── Identity: neon royal blue accent ───────────────────────────────────────────
  # ui_accent colors the tool marker, headings, links and chevrons.
  ui_accent: "#8aa6ff"
  banner_accent: "#8aa6ff"
  ui_primary: "#8aa6ff"
  banner_title: "#8aa6ff"

  # ── Text ladder, brightest to dimmest ─────────────────────────────────────
  ui_text: "#dfe6ff"
  banner_text: "#dfe6ff"
  ui_label: "#8a8edd"
  ui_thinking: "#647395"
  banner_dim: "#647395"

  # ── Rules and borders ─────────────────────────────────────────────────────
  banner_border: "#3b4c76"
  ui_border: "#3b4c76"
  input_rule: "#4e598a"
  response_border: "#8aa6ff"
  session_border: "#49577a"

  # ── Element tokens ────────────────────────────────────────────────────────
  # The tool bullet — the ● in front of every tool/task line — follows the
  # identity accent (same rule as the built-in `default` skin). The secondary hue
  # (#ff35c8) marks machine text instead: shell prompts and code keywords.
  ui_tool: "#8aa6ff"
  shell_dollar: "#ff35c8"
  prompt: "#8aa6ff"

  # ── Semantic status ───────────────────────────────────────────────────────
  # ok follows the identity (it paints the footer's "ready" state and the ✓/✔
  # success marks); warn/error stay semantic (amber/red) on purpose so the
  # 50/80/95% escalation of the context read-out still reads as a warning.
  ui_ok: "#8aa6ff"
  ui_warn: "#ffc400"
  ui_error: "#ff2d55"

  # ── Status bar ────────────────────────────────────────────────────────────
  status_bar_bg: "#040c14"
  status_bar_text: "#bec6e2"
  status_bar_strong: "#8aa6ff"
  status_bar_dim: "#647395"
  status_bar_good: "#8aa6ff"
  status_bar_warn: "#ffc400"
  status_bar_bad: "#ff8c1a"
  status_bar_critical: "#ff0055"
  session_label: "#8a8edd"
  voice_status_bg: "#040c14"

  # ── Completion menu ───────────────────────────────────────────────────────
  completion_menu_bg: "#050e18"
  completion_menu_current_bg: "#1b2459"
  completion_menu_meta_bg: "#040b12"
  completion_menu_meta_current_bg: "#3d4e90"
  selection_bg: "#1b2459"

  # ── Code syntax ───────────────────────────────────────────────────────────
  syntax_string: "#b6bbee"
  syntax_number: "#ffc400"
  syntax_keyword: "#ff35c8"
  syntax_comment: "#546386"

  # ── Diffs ─────────────────────────────────────────────────────────────────
  diff_added: "#737ccd"
  diff_removed: "#ff3b5c"
  diff_added_word: "#a3ace0"
  diff_removed_word: "#ff6b8a"

# Spinner: a pulsing block plus netrunner verbs.
spinner:
  waiting_faces: ["(░)", "(▒)", "(▓)", "(█)", "(▓)"]
  thinking_faces: ["(▓)", "(▒)", "(░)", "(▚)", "(▞)"]
  thinking_verbs:
    - "jacking in"
    - "decrypting the payload"
    - "spoofing the trace"
    - "compiling ice"
    - "reading the datastream"
    - "splicing the net"
    - "burning chrome"
    - "ghosting the mainframe"
  wings:
    - ["⟪░", "▒⟫"]
    - ["⟪▒", "▓⟫"]
    - ["⟪▓", "█⟫"]
    - ["⟪▚", "▞⟫"]

# Flavor. agent_name / response_label stay Hermes' own.
branding:
  welcome: "Neural link online. Type your message or /help for commands."
  goodbye: "Jacked out. ▌"
  prompt_symbol: "▌"
  help_header: "(⌁) Available Commands"

# Tool-line gutter.
tool_prefix: "▌"


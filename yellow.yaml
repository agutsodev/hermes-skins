# Hermes skin — Cyberpunk (Amarelo)
# Neon-amarelo cyberpunk terminal over near-black: the same palette family as the
# desktop/dashboard "cyberpunk" theme (neon green #00ff41 on #000a00), re-hued to
# amarelo.
#
# Activate:  hermes config set display.skin yellow
# One color: hermes skin set ui_tool "#ffee00"
# Revert:    hermes config set display.skin default

name: yellow
description: Cyberpunk amarelo — neon amarelo sobre preto

colors:
  # ── Canvas ────────────────────────────────────────────────────────────────
  # `background` is deliberately NOT authored: a skin that sets it makes the TUI
  # paint the terminal (OSC-11) opaque, which kills terminal transparency. Without
  # it every surface renders on the user's own (possibly translucent) terminal and
  # the polarity comes from host detection — exactly what the built-in `default`
  # skin does. The desktop GUI still gets a dark canvas from status_bar_bg.

  # ── Identity: neon yellow accent ───────────────────────────────────────────
  # ui_accent colors the tool marker, headings, links and chevrons.
  ui_accent: "#ffee00"
  banner_accent: "#ffee00"
  ui_primary: "#ffee00"
  banner_title: "#ffee00"

  # ── Text ladder, brightest to dimmest ─────────────────────────────────────
  ui_text: "#fffcb9"
  banner_text: "#fffcb9"
  ui_label: "#c5db27"
  ui_thinking: "#a59633"
  banner_dim: "#a59633"

  # ── Rules and borders ─────────────────────────────────────────────────────
  banner_border: "#6f640d"
  ui_border: "#6f640d"
  input_rule: "#7a7c00"
  response_border: "#ffee00"
  session_border: "#7f7413"

  # ── Element tokens ────────────────────────────────────────────────────────
  # The tool bullet — the ● in front of every tool/task line — follows the
  # identity accent (same rule as the built-in `default` skin). The secondary hue
  # (#00e5ff) marks machine text instead: shell prompts and code keywords.
  ui_tool: "#ffee00"
  shell_dollar: "#00e5ff"
  prompt: "#ffee00"

  # ── Semantic status ───────────────────────────────────────────────────────
  # ok follows the identity (it paints the footer's "ready" state and the ✓/✔
  # success marks); warn/error stay semantic (amber/red) on purpose so the
  # 50/80/95% escalation of the context read-out still reads as a warning.
  ui_ok: "#ffee00"
  ui_warn: "#ffab00"
  ui_error: "#ff2d55"

  # ── Status bar ────────────────────────────────────────────────────────────
  status_bar_bg: "#140e00"
  status_bar_text: "#fffdcb"
  status_bar_strong: "#ffee00"
  status_bar_dim: "#a59633"
  status_bar_good: "#ffee00"
  status_bar_warn: "#ffab00"
  status_bar_bad: "#ff6a00"
  status_bar_critical: "#ff0055"
  session_label: "#c5db27"
  voice_status_bg: "#140e00"

  # ── Completion menu ───────────────────────────────────────────────────────
  completion_menu_bg: "#181000"
  completion_menu_current_bg: "#575900"
  completion_menu_meta_bg: "#120c00"
  completion_menu_meta_current_bg: "#787500"
  selection_bg: "#575900"

  # ── Code syntax ───────────────────────────────────────────────────────────
  syntax_string: "#f4fc7c"
  syntax_number: "#ffab00"
  syntax_keyword: "#00e5ff"
  syntax_comment: "#90831e"

  # ── Diffs ─────────────────────────────────────────────────────────────────
  diff_added: "#b0c300"
  diff_removed: "#ff3b5c"
  diff_added_word: "#f6f968"
  diff_removed_word: "#ff6b8a"

# Spinner: a pulsing block plus netrunner verbs.
spinner:
  waiting_faces: ["(░)", "(▒)", "(▓)", "(█)", "(▓)"]
  thinking_faces: ["(▓)", "(▒)", "(░)", "(▚)", "(▞)"]
  thinking_verbs:
    - "jacking in"
    - "decrypting the payload"
    - "spoofing the trace"
    - "compiling ice"
    - "reading the datastream"
    - "splicing the net"
    - "burning chrome"
    - "ghosting the mainframe"
  wings:
    - ["⟪░", "▒⟫"]
    - ["⟪▒", "▓⟫"]
    - ["⟪▓", "█⟫"]
    - ["⟪▚", "▞⟫"]

# Flavor. agent_name / response_label stay Hermes' own.
branding:
  welcome: "Neural link online. Type your message or /help for commands."
  goodbye: "Jacked out. ▌"
  prompt_symbol: "▌"
  help_header: "(⌁) Available Commands"

# Tool-line gutter.
tool_prefix: "▌"


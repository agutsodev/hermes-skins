# Hermes skin — Cyberpunk (Rosa (fucsia))
# Neon-rosa (fucsia) cyberpunk terminal over near-black: the same palette family as the
# desktop/dashboard "cyberpunk" theme (neon green #00ff41 on #000a00), re-hued to
# rosa (fucsia).
#
# Activate:  hermes config set display.skin pink
# One color: hermes skin set ui_tool "#ff85de"
# Revert:    hermes config set display.skin default

name: pink
description: Cyberpunk rosa — neon fucsia sobre preto

colors:
  # ── Canvas ────────────────────────────────────────────────────────────────
  # `background` is deliberately NOT authored: a skin that sets it makes the TUI
  # paint the terminal (OSC-11) opaque, which kills terminal transparency. Without
  # it every surface renders on the user's own (possibly translucent) terminal and
  # the polarity comes from host detection — exactly what the built-in `default`
  # skin does. The desktop GUI still gets a dark canvas from status_bar_bg.

  # ── Identity: neon pink accent ───────────────────────────────────────────
  # ui_accent colors the tool marker, headings, links and chevrons.
  ui_accent: "#ff85de"
  banner_accent: "#ff85de"
  ui_primary: "#ff85de"
  banner_title: "#ff85de"

  # ── Text ladder, brightest to dimmest ─────────────────────────────────────
  ui_text: "#ffdef5"
  banner_text: "#ffdef5"
  ui_label: "#d480ad"
  ui_thinking: "#95628a"
  banner_dim: "#95628a"

  # ── Rules and borders ─────────────────────────────────────────────────────
  banner_border: "#733765"
  ui_border: "#733765"
  input_rule: "#84466e"
  response_border: "#ff85de"
  session_border: "#7a476f"

  # ── Element tokens ────────────────────────────────────────────────────────
  # The tool bullet — the ● in front of every tool/task line — follows the
  # identity accent (same rule as the built-in `default` skin). The secondary hue
  # (#00e5ff) marks machine text instead: shell prompts and code keywords.
  ui_tool: "#ff85de"
  shell_dollar: "#00e5ff"
  prompt: "#ff85de"

  # ── Semantic status ───────────────────────────────────────────────────────
  # ok follows the identity (it paints the footer's "ready" state and the ✓/✔
  # success marks); warn/error stay semantic (amber/red) on purpose so the
  # 50/80/95% escalation of the context read-out still reads as a warning.
  ui_ok: "#ff85de"
  ui_warn: "#ffc400"
  ui_error: "#ff2d55"

  # ── Status bar ────────────────────────────────────────────────────────────
  status_bar_bg: "#140414"
  status_bar_text: "#e1bbd7"
  status_bar_strong: "#ff85de"
  status_bar_dim: "#95628a"
  status_bar_good: "#ff85de"
  status_bar_warn: "#ffc400"
  status_bar_bad: "#ff8c1a"
  status_bar_critical: "#ff0055"
  session_label: "#d480ad"
  voice_status_bg: "#140414"

  # ── Completion menu ───────────────────────────────────────────────────────
  completion_menu_bg: "#180518"
  completion_menu_current_bg: "#591b42"
  completion_menu_meta_bg: "#120412"
  completion_menu_meta_current_bg: "#86326b"
  selection_bg: "#591b42"

  # ── Code syntax ───────────────────────────────────────────────────────────
  syntax_string: "#e6add0"
  syntax_number: "#ffc400"
  syntax_keyword: "#00e5ff"
  syntax_comment: "#86517b"

  # ── Diffs ─────────────────────────────────────────────────────────────────
  diff_added: "#c8689f"
  diff_removed: "#ff394a"
  diff_added_word: "#e2a2cb"
  diff_removed_word: "#ff6b77"

# Spinner: a pulsing block plus netrunner verbs.
spinner:
  waiting_faces: ["(░)", "(▒)", "(▓)", "(█)", "(▓)"]
  thinking_faces: ["(▓)", "(▒)", "(░)", "(▚)", "(▞)"]
  thinking_verbs:
    - "jacking in"
    - "decrypting the payload"
    - "spoofing the trace"
    - "compiling ice"
    - "reading the datastream"
    - "splicing the net"
    - "burning chrome"
    - "ghosting the mainframe"
  wings:
    - ["⟪░", "▒⟫"]
    - ["⟪▒", "▓⟫"]
    - ["⟪▓", "█⟫"]
    - ["⟪▚", "▞⟫"]

# Flavor. agent_name / response_label stay Hermes' own.
branding:
  welcome: "Neural link online. Type your message or /help for commands."
  goodbye: "Jacked out. ▌"
  prompt_symbol: "▌"
  help_header: "(⌁) Available Commands"

# Tool-line gutter.
tool_prefix: "▌"

